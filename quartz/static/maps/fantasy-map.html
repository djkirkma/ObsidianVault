<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fantasy World Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* Custom label style */
    .map-label {
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Load a flat image as a map
    // Replace this with your fantasy map image
    const imageUrl = "hewe.jpg"

    // Image size (in pixels)
    const imageWidth = 2048;
    const imageHeight = 1536;

    // Coordinate bounds for the image
    const mapBounds = [[0, 0], [imageHeight, imageWidth]];

    // Initialize map
    const map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1,
      maxZoom: 2
    });

    // Add image overlay
    L.imageOverlay(imageUrl, mapBounds).addTo(map);
    map.fitBounds(mapBounds);

    // Example markers
    const cities = [
      { name: "Eldoria", coords: [700, 200], desc: "The capital of the human realm." },
      { name: "Duskvale", coords: [900, 100], desc: "A cursed valley shrouded in eternal twilight." },
      { name: "Stormpeak", coords: [300, 200], desc: "Home of the mountain clans." }
    ];

    cities.forEach(city => {
      const marker = L.marker(city.coords).addTo(map);
      marker.bindPopup(`<b>${city.name}</b><br>${city.desc}`);
    });

    // Example labels (these don't open, just text overlays)
    const labels = [
      { name: "The Frostlands", coords: [300, 300] },
      { name: "Emerald Coast", coords: [300, 400] },
      { name: "Ashen Wastes", coords: [300, 100] }
    ];

    labels.forEach(label => {
      L.marker(label.coords, {
        icon: L.divIcon({
          className: "map-label",
          html: label.name,
          iconSize: [100, 30]
        })
      }).addTo(map);
    });
  </script>
</body>
</html>
